name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  # A push to main is what makes a release: bump the version, commit, tag. The
  # tag then drives package and release, so nothing is packaged twice and a tag
  # push never loops back into this job.
  version:
    needs: typecheck-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - id: bump
        run: |
          LATEST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v1.0.0')
          NEXT=$(echo "$LATEST" | awk -F. '{$NF++; print}' OFS=.)
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          git config user.name  "dexs-ci"
          git config user.email "dexs-ci@users.noreply.github.com"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$NEXT';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts
          git add package.json package-lock.json
          git commit -m "release $NEXT"
          git tag -a "$NEXT" -m "release $NEXT"
          git push --follow-tags

  # Only tag pushes and manual runs build: a branch push is picked up by the
  # tag the version job creates.
  package:
    needs: typecheck-test
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Windows code signing. With WIN_CERTIFICATE_B64 set to a base64 .pfx the
      # MSI is signed; with no secret the build is unsigned, exactly as before.
      - name: Signing certificate
        if: runner.os == 'Windows' && secrets.WIN_CERTIFICATE_B64 != ''
        shell: bash
        run: |
          echo "${{ secrets.WIN_CERTIFICATE_B64 }}" | base64 -d > "${{ runner.temp }}/cert.pfx"
          echo "CSC_LINK=${{ runner.temp }}/cert.pfx" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      # patchelf is what lets the packaged app find libonnxruntime.so beside the
      # sherpa addon; Linux only, since PE files carry no RPATH.
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - run: npm ci
      - run: npx electron-vite build
      # afterPack downloads the speech models into resources/models, so the
      # installers work the moment they launch.
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: dexs-${{ matrix.os }}
          path: |
            dist/*.msi
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'dexs-*', path: artifacts, merge-multiple: true }
      - name: Publish (create the release, or replace its assets if it exists)
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dexs $GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  # Bumping the version and tagging is what makes a release happen, so it runs
  # first on a main push and never on a tag push (which would loop forever).
  version:
    needs: typecheck-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - id: bump
        run: |
          LATEST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v1.0.0')
          NEXT=$(echo "$LATEST" | awk -F. '{$NF++; print}' OFS=.)
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          git config user.name  "ci"
          git config user.email "ci@users.noreply.github.com"
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEXT\"/" package.json
          npm install --package-lock-only --ignore-scripts --silent
          git add package.json package-lock.json
          git commit -m "release $NEXT [skip ci]"
          git tag -a "$NEXT" -m "release $NEXT"
          git push --follow-tags

  # Runs for a tag push (created by the version job) or a manual run. Building
  # on the branch push as well would package the same commit twice.
  package:
    needs: typecheck-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Windows only: put the code signing certificate on disk. When
      # WIN_CERTIFICATE_B64 is empty the build is unsigned, exactly as before.
      - name: Signing certificate
        if: runner.os == 'Windows' && secrets.WIN_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WIN_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("${{ runner.temp }}\cert.pfx", $bytes)
          echo "CSC_LINK=${{ runner.temp }}\cert.pfx" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CERTIFICATE_PASSWORD }}" >> $env:GITHUB_ENV
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $env:GITHUB_ENV
      # Linux only: patchelf is needed for the sherpa native addon's RPATH.
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - run: npm ci
      - run: npx electron-vite build
      # The afterPack hook fetches the speech models so the installers ship
      # with everything dictation needs.
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: dexs-${{ matrix.os }}
          path: |
            dist/*.msi
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  release:
    needs: [package, version]
    if: always() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dexs-*
          path: artifacts
          merge-multiple: true
      - name: Publish (create, or replace assets on an existing release)
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dexs $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}